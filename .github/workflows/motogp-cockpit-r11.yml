name: MotoGP cockpit R1.1 delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/motogp-cockpit-r11.yml']
permissions:
  contents: write
concurrency:
  group: motogp-cockpit-r11-delivery
  cancel-in-progress: false
jobs:
  integrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APEX_BROWSER_BACKEND: swiftshader
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and apply the R1 to R1.1 correction without replacing unrelated source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/motogp-evidence"
          echo '2db81a11c57c214a7dbe0b8586d50b8d7566266c802b7ed22a21d184cbd5188f  tools/motogp/stage/cockpit-r11.patch.xz' | sha256sum -c -
          xz -dc tools/motogp/stage/cockpit-r11.patch.xz > "$RUNNER_TEMP/cockpit-r11.patch"
          echo "0509ae02e9aeddcbfbc4bc0941e306107a99ad0dba3e59d16e5c8ccfa529e446  $RUNNER_TEMP/cockpit-r11.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/cockpit-r11.patch"
          git apply "$RUNNER_TEMP/cockpit-r11.patch"
          cp "$RUNNER_TEMP/cockpit-r11.patch" "$RUNNER_TEMP/motogp-evidence/"
      - name: Install the exact desktop Blender authoring runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" --version | tee "$RUNNER_TEMP/motogp-evidence/blender-version.txt"
      - name: Independently rebuild twice and verify the open instrument recess
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            "$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" -b --factory-startup -t 2 --python tools/motogp/build_gp_bodywork.py -- --out "$RUNNER_TEMP/gp-bodywork-$attempt" 2>&1 | tee "$RUNNER_TEMP/motogp-evidence/blender-$attempt.log"
            echo "29aed319fbbc6a70805704c9c88c125b6481abd38514a2619e246f0569dd847f  $RUNNER_TEMP/gp-bodywork-$attempt/gp-bodywork.mesh.json" | sha256sum -c -
          done
          cmp "$RUNNER_TEMP/gp-bodywork-1/gp-bodywork.mesh.json" "$RUNNER_TEMP/gp-bodywork-2/gp-bodywork.mesh.json"
          mv "$RUNNER_TEMP/gp-bodywork-1" "$RUNNER_TEMP/gp-bodywork"
          cp "$RUNNER_TEMP/gp-bodywork/gp-bodywork.mesh.json" src/rendering/assets/
          cp "$RUNNER_TEMP/gp-bodywork/gp-bodywork-stats.json" tools/motogp/
          cp "$RUNNER_TEMP/gp-bodywork/motobound-gp-bodywork.blend" authoring/motogp/
          cp "$RUNNER_TEMP/gp-bodywork/motobound-gp-bodywork.glb" authoring/motogp/
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('tools/motogp/authoring-runtime.json')
          record = json.loads(path.read_text())
          record.update({
              'revision': 'MotoGP R1.1 cockpit',
              'meshSHA256': '29aed319fbbc6a70805704c9c88c125b6481abd38514a2619e246f0569dd847f',
              'meshSchemaVersion': 2,
              'localIndependentMatchingBakes': 2,
              'hostedIndependentMatchingBakes': 2,
              'repair': 'Retain deterministic fin/fence UV projection. Add an actual rounded instrument recess and shared high/mid upper-cowl geometry for road-racing cockpits.',
              'scope': 'Deterministic bodywork bake and component contracts; not full navigation, consumer GPU performance, PS5 parity or live-site certification.'
          })
          path.write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund
      - name: Create the candidate commit without moving remote main
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/motogp/stage/cockpit-r11.patch.xz .github/workflows/motogp-cockpit-r11.yml
          git add src/rendering/bike.ts src/rendering/bike-cockpit.ts src/rendering/rider.ts src/rendering/renderer.ts src/rendering/gp-bodywork.ts src/rendering/assets/gp-bodywork.mesh.json tools/motogp/build_gp_bodywork.py tools/motogp/gp-bodywork-stats.json tools/motogp/authoring-runtime.json tests/bike-cockpit-view.test.ts e2e/fixtures/bike-cockpit-contract.ts e2e/fixtures/motogp-reference-review.ts e2e/41-motogp-reference.spec.ts docs/MOTOGP_COCKPIT_R11.md authoring/motogp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(motogp): open the cockpit and validate the real onboard camera' -m 'Correct dashboard facing and mount, carve an original rounded instrument recess, share only the upper cowl with full-fairing road bikes, select the motorcycle lens explicitly and restore rider heads outside first-person. Preserve physics, suspension, other vehicle identities and concurrent GPU fence repairs. Add 144 camera/pose combinations with 1296 sampled sightlines, camera ownership tests and four real onboard GPU captures without relaxing previous assertions. Include reproducible Blender sources, editable native assets and explicit validation boundaries.'
          git rev-parse HEAD | tee "$RUNNER_TEMP/motogp-evidence/candidate-commit.txt"
      - name: Run all lint, catalogue, unit, TypeScript and production build checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/motogp-evidence/check.log"
          cp dist/BUILD_IDENTITY.json "$RUNNER_TEMP/motogp-evidence/"
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Render all LODs, wet reversal and four production onboard cameras
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a npx playwright test e2e/41-motogp-reference.spec.ts 2>&1 | tee "$RUNNER_TEMP/motogp-evidence/gpu.log"
      - name: Push only the validated candidate with a main-head guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- src tests e2e tools/motogp package-lock.json
          git diff --cached --exit-code
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'main advanced; inspect and reconcile before retrying; no force push'; exit 1; }
          git push origin HEAD:main
          git rev-parse HEAD | tee "$RUNNER_TEMP/motogp-evidence/pushed-commit.txt"
          echo "Validated MotoGP cockpit revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Full unit/build and focused GPU checks passed; full navigation/release and live deployment remain separate gates.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve validation evidence and editable assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motogp-cockpit-r11-validation
          path: |
            ${{ runner.temp }}/motogp-evidence/
            ${{ runner.temp }}/gp-bodywork/
            test-results/
            playwright-report/
            browser-backend.json
          compression-level: 6
          retention-days: 7
          if-no-files-found: error
