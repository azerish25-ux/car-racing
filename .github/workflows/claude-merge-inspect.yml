name: Claude merge consolidation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/claude-merge-inspect.yml']
  workflow_dispatch:
concurrency:
  group: claude-merge-consolidation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/scratch-tmp/
            !/playable/
            !/docs/session-artifacts/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve only reviewed conflicts and preserve all source histories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import subprocess, pathlib, re, json, hashlib, os
          GROUND = 'c77dc39fe3a4b1309cb6907c2085097cdb96406f'
          VEGETATION = 'a5759f8fe7dcd12893f309f1232879830164c634'
          PATTERN = re.compile(r'^<<<<<<< [^\n]*\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]*\n', re.M | re.S)
          def git(*args, data=None, allowed=(0,)):
              result = subprocess.run(['git', *args], input=data, text=True, capture_output=True)
              if result.returncode not in allowed:
                  raise RuntimeError(f'git {args}: {result.stderr}\n{result.stdout}')
              return result.stdout
          def blocks(text, count, decide):
              matches = list(PATTERN.finditer(text))
              if len(matches) != count:
                  raise RuntimeError(f'Expected {count} reviewed conflicts, found {len(matches)}')
              i = iter(range(count))
              result = PATTERN.sub(lambda m: decide(next(i), m[1], m[2]), text)
              if re.search(r'^(<<<<<<< |=======|>>>>>>> )', result, re.M):
                  raise RuntimeError('Unresolved conflict marker')
              return result
          def join(a, b):
              return a.rstrip() + '\n\n' + b.lstrip()
          def resolve_ground(text):
              def css(i, a, b):
                  assert '.meeting-steps' in a and '.credits-list' in b
                  return a + '}\n' + b
              return blocks(text, 1, css)
          def resolve_vegetation(source):
              result = dict(source)
              p = 'scripts/assets/build-third-party.ts'
              def build(i, a, b):
                  if i == 0:
                      assert "'./texture-ops.ts'" in a and 'buildVegetation' in b
                      return a + b
                  assert 'const shipped' in a and 'for (const kind' in b
                  return a.replace("['hdri', 'texture', 'mesh', ...", "['hdri', 'texture', 'mesh', 'vegetation', ...")
              result[p] = blocks(source[p], 2, build)
              p = 'scripts/assets/register.ts'
              def register(i, a, b):
                  if i == 0:
                      assert 's.area' in a and "'vegetation'" in b
                      return a.replace("['hdri', 'texture', 'mesh']", "['hdri', 'texture', 'mesh', 'vegetation']")
                  assert 's.recipe.synth' in a and 'validateVegetationRecipe' in b
                  return a + '    }\n' + b
              result[p] = blocks(source[p], 2, register)
              p = 'public/assets/third-party/CREDITS.txt'
              result[p] = blocks(source[p], 1, lambda i,a,b: join(a,b))
              p = 'src/rendering/assets/third-party-manifest.json'
              manifest = json.loads(blocks(source[p], 2, lambda i,a,b: a))
              assert len(manifest['assets']) == len({a['id'] for a in manifest['assets']}) == 31
              credits = result['public/assets/third-party/CREDITS.txt'].encode('utf-8')
              assert len(manifest['documents']) == 1
              doc = manifest['documents'][0]
              assert doc['path'] == 'assets/third-party/CREDITS.txt'
              doc['bytes'] = len(credits)
              doc['sha256'] = hashlib.sha256(credits).hexdigest()
              manifest['totalBytes'] = sum(f['bytes'] for a in manifest['assets'] for f in a['files']) + sum(d['bytes'] for d in manifest['documents'])
              assert manifest['totalBytes'] <= manifest['budgetBytes']
              result[p] = json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
              p = 'docs/ASSET_PROVENANCE.md'
              def provenance(i, a, b):
                  if i == 0:
                      return ('**Since 2026-10-15 the application also ships licensed third-party content** — photographed skies (HDRIs), scanned ground textures under CC0 1.0 and CC BY 4.0, and photographic trees, a shrub and meadow grass baked from CC BY 4.0 plant models — because procedural generation alone could not reach a photographic look (decisions D14, D14.1 and D15 in [DECISIONS_AND_RISKS.md](production/DECISIONS_AND_RISKS.md)). The rules, register and asset list are in [Third-party assets](#third-party-assets) below. Procedural vegetation remains the LOW/MEDIUM path and fallback; scanned ground is enabled on MEDIUM and above.\n')
                  if i == 1:
                      return f"**Shipped today ({manifest['totalBytes'] / 1048576:.2f} MiB of the 150 MiB budget, including ground and vegetation).**\n"
                  if i == 2:
                      assert '| sandy-gravel-01 |' in a and '| sandy-gravel-01 |' in b
                      return a + '\n'.join(line for line in b.splitlines() if not line.startswith('| sandy-gravel-01 |')) + '\n'
                  assert 'The third-party skies' in a and 'Vegetation is photographic' in b
                  intro = '**Still original/procedural.** Cars, bikes, riders, crews, buildings, terrain geometry, barriers, crowds and the remaining procedural materials are the repository\'s own procedural or Blender-authored work. '
                  return intro + a[a.index('The third-party skies'):].rstrip() + ' ' + b[b.index('Vegetation is photographic'):]
              result[p] = blocks(source[p], 4, provenance)
              p = 'docs/production/DECISIONS_AND_RISKS.md'
              result[p] = blocks(source[p], 1, lambda i,a,b: a+b).replace('§8b, `tests/photo-vegetation.test.ts`', '§8c, `tests/photo-vegetation.test.ts`')
              p = 'docs/production/RENDERING_PIPELINE.md'
              result[p] = blocks(source[p], 2, lambda i,a,b: join(a,b)).replace('## 8b. Photographic vegetation', '## 8c. Photographic vegetation')
              return result, manifest
          def install(path, content):
              sha = git('hash-object', '-w', '--stdin', data=content).strip()
              git('update-index', '--add', '--cacheinfo', f'100644,{sha},{path}')
          def merge(base, head, ground=False):
              output = git('merge-tree', '--write-tree', base, head, allowed=(0,1))
              print(output, flush=True)
              tree = output.splitlines()[0]
              paths = {m[1] for m in re.finditer(r'^\d{6} [0-9a-f]{40} [123]\t(.+)$', output, re.M)}
              source = {p: git('show', f'{tree}:{p}') for p in paths}
              if ground:
                  assert paths == {'src/ui/style.css'}, paths
                  resolved = {'src/ui/style.css': resolve_ground(source['src/ui/style.css'])}
              else:
                  expected = {'docs/ASSET_PROVENANCE.md', 'docs/production/DECISIONS_AND_RISKS.md', 'docs/production/RENDERING_PIPELINE.md', 'public/assets/third-party/CREDITS.txt', 'scripts/assets/build-third-party.ts', 'scripts/assets/register.ts', 'src/rendering/assets/third-party-manifest.json'}
                  assert paths == expected, paths
                  resolved, manifest = resolve_vegetation(source)
                  indexed = {a['id']:a for a in manifest['assets']}
                  register = json.loads(git('show', f'{tree}:assets/third-party/sources.json'))
                  fragments = git('ls-tree', '-r', '--name-only', tree, '--', 'assets/third-party/sources').splitlines()
                  for path in sorted(p for p in fragments if p.endswith('.json')):
                      register['sources'].extend(json.loads(git('show', f'{tree}:{path}'))['sources'])
                  order = [s['id'] for s in register['sources']]
                  assert len(order) == len(set(order)) == len(indexed) and set(order) == set(indexed)
                  manifest['assets'] = [indexed[identifier] for identifier in order]
                  resolved['src/rendering/assets/third-party-manifest.json'] = json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
                  def contains(final, old):
                      if isinstance(old, dict):
                          return all(k in final and contains(final[k],v) for k,v in old.items())
                      return final == old
                  for branch in (GROUND, VEGETATION):
                      old = json.loads(git('show', f'{branch}:src/rendering/assets/third-party-manifest.json'))
                      for asset in old['assets']:
                          assert contains(indexed[asset['id']], asset), asset['id']
                  print(f"Preserved {len(indexed)} assets in source-register order; shipment {manifest['totalBytes']} bytes", flush=True)
              git('read-tree', tree)
              for path, content in resolved.items(): install(path, content)
              tree = git('write-tree').strip()
              kind = 'photoreal ground and sky' if ground else 'photoreal vegetation'
              return git('commit-tree', tree, '-p', base, '-p', head, '-m', f'Merge Claude {kind} developments into main; preserve shared systems').strip()
          base = os.environ['GITHUB_SHA']
          assert git('rev-parse', 'origin/main').strip() == base, 'main moved; inspect the new head before retrying'
          first = merge(base, GROUND, ground=True)
          final = merge(first, VEGETATION)
          git('reset', '--hard', final)
          for sha in (GROUND, VEGETATION, 'd0a10026e38c6e603ba12402f72da0e22117c04e', '6a64a6307633ea6a1d5cd857383efe43502e5c28', 'ce5035b0202d03b4a397fe522610549feef349af', 'cefbe7c207029607f085425c35ab68188bdd32f6'):
              git('merge-base', '--is-ancestor', sha, final)
          print('ALL SIX SOURCE HEADS ARE ANCESTORS:', final, flush=True)
          pathlib.Path('/tmp/claude-merged-head.txt').write_text(final+'\n')
          PY
      - name: Install locked dependencies without source mutation
        run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      - name: Lint, content validation, all unit tests, and production build
        run: npm run check:stable
      - name: Publish only the validated merge, without force-pushing
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
          echo "Merged and checked all six Claude source heads: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve consolidated revision identifier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-consolidated-revision
          path: /tmp/claude-merged-head.txt
          retention-days: 1
