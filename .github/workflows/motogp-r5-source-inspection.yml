name: MotoGP R5 source inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/motogp-r5-source-inspection.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify and inspect the immutable source transfer
        uses: actions/github-script@v7
        with:
          script: |
            const { createHash } = require('node:crypto');
            const { brotliDecompressSync } = require('node:zlib');
            const { writeFileSync, mkdirSync } = require('node:fs');
            const { join } = require('node:path');
            const out = join(process.env.RUNNER_TEMP, 'motogp-r5-source-inspection');
            mkdirSync(out, { recursive: true });
            core.exportVariable('R5_INSPECTION_DIR', out);
            const shas = ['fc3dc1616b41cf2e8766cd7cce13fee30da77885','9df51b10708e08199bf96b2060d3e0a22ab756d3','3c6c4c040d9bb90faa8d6b052be8765e698eeaf4','bd78dd86929fb8edc761f6ff77cf67eb1f760f6a','11c0e93cd8be7f04552ab03001235d703339af76','7da4515631f258cffbf0fca3ec766a55b861c704'];
            const parts = [];
            for (const sha of shas) {
              const { data } = await github.rest.git.getBlob({ ...context.repo, file_sha: sha });
              if (data.encoding !== 'base64' || data.sha !== sha) throw Error('Unexpected transfer blob');
              const bytes = Buffer.from(data.content, 'base64');
              const actual = createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
              if (actual !== sha) throw Error('Transfer Git-blob identity mismatch');
              parts.push(bytes);
            }
            const patch = brotliDecompressSync(Buffer.concat(parts));
            const hash = createHash('sha256').update(patch).digest('hex');
            if (patch.length !== 113846 || hash !== 'bcec2a979400774f9419fe769d050dc4dcb1e773815677b73cb500deb5a0061f') throw Error('Unexpected source patch identity');
            writeFileSync(join(out, 'r5.patch'), patch);
            writeFileSync(join(out, 'identity.json'), JSON.stringify({ commit: context.sha, bytes: patch.length, sha256: hash }, null, 2) + '\n');
            const text = patch.toString('utf8');
            console.log('PATCH_IDENTITY', patch.length, hash);
            console.log('PATCHED_PATHS\n' + text.split('\n').filter(line => line.startsWith('diff --git ')).join('\n'));
            const sections = text.split(/(?=^diff --git )/m);
            for (const path of ['tools/motogp/verify_r5_assets.py','tools/motogp/authoring-runtime.json','tools/motogp/build_gp_bodywork.py','tools/motogp/gp-bodywork-stats.json','docs/MOTOGP_R5_DELIVERY.md','tools/motogp/build_r5_reference_audit.py','scripts/lib/human-sculpt.ts']) {
              const matches = sections.filter(section => section.startsWith(`diff --git a/${path} b/${path}\n`));
              if (matches.length !== 1) throw Error(`Missing or repeated source section: ${path}`);
              core.startGroup(`SOURCE ${path}`);
              console.log(matches[0]);
              core.endGroup();
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motogp-r5-source-inspection
          path: ${{ env.R5_INSPECTION_DIR }}
          if-no-files-found: error
          retention-days: 7
