name: Motocross authored assets and riding review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/motocross-authored-review.yml]
permissions:
  contents: read
concurrency:
  group: motocross-authored-review
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Decode exact reviewed source without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mx-candidate" "$RUNNER_TEMP/mx-web"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          import { execFileSync } from 'node:child_process';
          const ids=['387570feb738aecc109219847e53392eabfe76a2','bda33baec7ae09d51ba8ed62f8837e275db3af3e','fdf1cc280240cb227e08614d6bcc055c6e33488d','0fd17412ce87365c877b141c295b157d97fda1c7'];
          const parts=[];
          for(const sha of ids){
            const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs/${sha}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
            if(!r.ok)throw Error(`Source fragment HTTP ${r.status}`);
            const j=await r.json(), b=Buffer.from(j.content,'base64');
            const digest=createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
            if(digest!==sha)throw Error('Source fragment integrity failure');
            parts.push(b);
          }
          const patch=brotliDecompressSync(Buffer.concat(parts));
          if(patch.length!==96236 || createHash('sha256').update(patch).digest('hex')!=='84d9ae160aba968f518218450e801c0b38b815e4aa94d449c8f0767b11564ad1')throw Error('Patch integrity failure');
          const expected={};
          for(const section of patch.toString().split('diff --git ').slice(1)){
            const path=section.match(/^a\/(.+) b\/\1\n/)?.[1], old=section.match(/^index ([0-9a-f]{40})\.\./m)?.[1];
            if(!path||!old||path.includes('..'))throw Error('Unexpected patch path');
            let actual=null; try{actual=execFileSync('git',['rev-parse','--verify',`HEAD:${path}`],{encoding:'utf8',stdio:['ignore','pipe','ignore']}).trim()}catch{}
            if(actual!==(old==='0'.repeat(40)?null:old))throw Error(`Concurrent source change: ${path}`);
            expected[path]=actual;
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/mx-candidate/source.patch`,patch);
          writeFileSync(`${process.env.RUNNER_TEMP}/mx-candidate/expected-inputs.json`,JSON.stringify(expected,null,2)+'\n');
          JS
          git apply --check --index "$RUNNER_TEMP/mx-candidate/source.patch"
          git apply --index "$RUNNER_TEMP/mx-candidate/source.patch"
      - name: Install locked tools and pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libice6
          curl --fail --location --retry 2 --max-time 240 -o "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Reproduce native and runtime assets and the recorded image ledger
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/rendering/assets/mx-authored-kit.mesh.json
          test ! -e authoring/motocross/motocross-authored-kit.blend
          test ! -e docs/production/motocross-reference-review-20261017.json
          blender -b -t 2 --factory-startup --python-exit-code 1 --python authoring/motocross/build_kit.py -- --output src/rendering/assets/mx-authored-kit.mesh.json --blend authoring/motocross/motocross-authored-kit.blend 2>&1 | tee "$RUNNER_TEMP/mx-candidate/blender.log"
          echo '595f697d29374ec92bd113ced1e6058f6a72df6ff40b5c906501b4b53401c20e  src/rendering/assets/mx-authored-kit.mesh.json' | sha256sum --check
          python authoring/motocross/review_100.py
          echo 'b3f0d6c6c5d8711d2cb73c1c45aa500ba898342110a8214013261b5c2e2484b1  docs/production/motocross-reference-review-20261017.json' | sha256sum --check
          git add -- src/rendering/assets/mx-authored-kit.mesh.json authoring/motocross/motocross-authored-kit.blend docs/production/motocross-reference-review-20261017.json
      - name: Lint, content validation, new contracts, TypeScript and production build
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-transform-types scripts/source-stability.ts -- bash -c 'npm run lint && npm run validate:content && npx vitest run tests/motocross-authored-kit.test.ts tests/motocross-rhythm-coach.test.ts tests/motocross-reference-review.test.ts && npm run build' 2>&1 | tee "$RUNNER_TEMP/mx-candidate/build-check.log"
          git diff --exit-code
      - name: Preserve reviewable candidate blobs and exact source identities, never promote automatically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync,writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const dir=`${process.env.RUNNER_TEMP}/mx-candidate`;
          const paths=execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean);
          const expected=JSON.parse(readFileSync(`${dir}/expected-inputs.json`,'utf8'));
          const manifest={baseCommit:process.env.GITHUB_SHA,validation:'candidate only; consult all QA jobs before promotion',files:[]};
          for(const path of paths){
            const bytes=readFileSync(path);
            const blob=createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({encoding:'base64',content:bytes.toString('base64')})});
            if(!r.ok)throw Error(`Candidate blob HTTP ${r.status}: ${path}`);
            if((await r.json()).sha!==blob)throw Error(`Candidate blob mismatch: ${path}`);
            manifest.files.push({path,before:expected[path]??null,blob,sha256:createHash('sha256').update(bytes).digest('hex'),bytes:bytes.length});
          }
          writeFileSync(`${dir}/candidate-manifest.json`,JSON.stringify(manifest,null,2)+'\n');
          execFileSync('tar',['-czf',`${dir}/source-changes.tar.gz`,'--',...paths]);
          JS
          tar -czf "$RUNNER_TEMP/mx-web/dist.tar.gz" dist
          sha256sum "$RUNNER_TEMP/mx-web/dist.tar.gz" > "$RUNNER_TEMP/mx-web/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motocross-authored-candidate
          path: ${{ runner.temp }}/mx-candidate/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: motocross-authored-web
          path: ${{ runner.temp }}/mx-web/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  qa:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [models-world, journey, units, scenarios]
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: motocross-authored-candidate
          path: ${{ runner.temp }}/mx-candidate
      - name: Restore and verify only the candidate changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mx-qa"
          tar -xzf "$RUNNER_TEMP/mx-candidate/source-changes.tar.gz"
          python - <<'PY'
          import json,hashlib,pathlib,os,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          manifest=json.loads((root/'mx-candidate/candidate-manifest.json').read_text())
          assert manifest['baseCommit']==os.environ['GITHUB_SHA']
          for entry in manifest['files']:
              assert hashlib.sha256(pathlib.Path(entry['path']).read_bytes()).hexdigest()==entry['sha256'],entry['path']
          subprocess.run(['git','add','--',*[x['path'] for x in manifest['files']]],check=True)
          PY
          npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'models-world' || matrix.suite == 'journey'
        with:
          name: motocross-authored-web
          path: ${{ runner.temp }}/mx-web
      - name: Install exact browser and Mesa for original browser checks
        if: matrix.suite == 'models-world' || matrix.suite == 'journey'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/mx-web/dist.tar.gz"
          npx playwright install --with-deps chromium
          sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Original model, terrain, wetness, shadow and compact-interface assertions
        if: matrix.suite == 'models-world'
        shell: bash
        run: |
          set -euo pipefail
          if xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test e2e/42-motocross-bike.spec.ts e2e/43-motocross-world.spec.ts e2e/44-motocross-interface.spec.ts --config playwright.motocross.config.ts 2>&1 | tee "$RUNNER_TEMP/mx-qa/browser.log"; then echo 0 > "$RUNNER_TEMP/mx-qa/exit.txt"; else code=$?; echo "$code" > "$RUNNER_TEMP/mx-qa/exit.txt"; exit "$code"; fi
      - name: Complete original real player journey through both venues
        if: matrix.suite == 'journey'
        shell: bash
        run: |
          set -euo pipefail
          if xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test e2e/45-motocross-gameplay.spec.ts --config playwright.motocross.config.ts 2>&1 | tee "$RUNNER_TEMP/mx-qa/journey.log"; then echo 0 > "$RUNNER_TEMP/mx-qa/exit.txt"; else code=$?; echo "$code" > "$RUNNER_TEMP/mx-qa/exit.txt"; exit "$code"; fi
      - name: Complete unit suite without source mutations
        if: matrix.suite == 'units'
        shell: bash
        run: |
          set -euo pipefail
          if node --experimental-transform-types scripts/source-stability.ts -- npm test 2>&1 | tee "$RUNNER_TEMP/mx-qa/units.log"; then echo 0 > "$RUNNER_TEMP/mx-qa/exit.txt"; else code=$?; echo "$code" > "$RUNNER_TEMP/mx-qa/exit.txt"; exit "$code"; fi
      - name: Complete original offroad calibration and race scenarios
        if: matrix.suite == 'scenarios'
        shell: bash
        run: |
          set -euo pipefail
          cp docs/offroad-calibration.json "$RUNNER_TEMP/mx-qa/before-calibration.json"
          cp docs/offroad-races.json "$RUNNER_TEMP/mx-qa/before-races.json"
          trap 'cp docs/offroad-calibration.json "$RUNNER_TEMP/mx-qa/offroad-calibration.json"; cp docs/offroad-races.json "$RUNNER_TEMP/mx-qa/offroad-races.json"; cp "$RUNNER_TEMP/mx-qa/before-calibration.json" docs/offroad-calibration.json; cp "$RUNNER_TEMP/mx-qa/before-races.json" docs/offroad-races.json' EXIT
          if npm run test:offroad 2>&1 | tee "$RUNNER_TEMP/mx-qa/scenarios.log"; then echo 0 > "$RUNNER_TEMP/mx-qa/exit.txt"; else code=$?; echo "$code" > "$RUNNER_TEMP/mx-qa/exit.txt"; exit "$code"; fi
      - name: Verify candidate inputs did not change during QA
        shell: bash
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motocross-authored-qa-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/mx-qa/
            test-results/motocross/
          retention-days: 3
          if-no-files-found: error
