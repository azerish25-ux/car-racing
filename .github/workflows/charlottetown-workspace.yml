name: Charlottetown implementation workspace
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/charlottetown-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    if: github.repository == 'azerish25-ux/car-racing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Snapshot tracked source at the triggering commit
        run: |
          git rev-parse HEAD > /tmp/source-commit.txt
          git archive --format=tar.gz --output=/tmp/charlottetown-code.tar.gz HEAD src tests e2e scripts reference docs .github package.json package-lock.json tsconfig.json vite.config.ts vitest.config.ts playwright.config.ts eslint.config.js index.html README.md .gitignore .gitattributes .prettierrc.json
      - uses: actions/upload-artifact@v4
        with:
          name: charlottetown-code
          path: |
            /tmp/charlottetown-code.tar.gz
            /tmp/source-commit.txt
          retention-days: 2
      - name: Snapshot tracked runtime assets separately
        run: git archive --format=tar.gz --output=/tmp/charlottetown-runtime.tar.gz HEAD public
      - uses: actions/upload-artifact@v4
        with:
          name: charlottetown-runtime
          path: /tmp/charlottetown-runtime.tar.gz
          retention-days: 2
