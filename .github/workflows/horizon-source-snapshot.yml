name: Horizon source snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/horizon-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve exact source and blob identities without rebuilding assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/horizon-source"
          git archive HEAD | gzip -1 > "$RUNNER_TEMP/horizon-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/horizon-source/commit.txt"
          git ls-files -s > "$RUNNER_TEMP/horizon-source/git-index.txt"
      - name: Recover interrupted Horizon transfer for inspection only
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const sha = '7d764f183a4b6b04243c3a2551154786f5290b2a';
            const { data } = await github.rest.git.getBlob({ ...context.repo, file_sha: sha });
            if (data.encoding !== 'base64') throw Error('Unexpected blob encoding');
            const bytes = Buffer.from(data.content, 'base64');
            if (crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex') !== sha) throw Error('Blob identity mismatch');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'horizon-source', 'interrupted-transfer.br'), bytes);
      - name: Checksum snapshot
        shell: bash
        run: |
          cd "$RUNNER_TEMP/horizon-source"
          sha256sum source.tar.gz git-index.txt interrupted-transfer.br > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-source-snapshot
          path: ${{ runner.temp }}/horizon-source/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
