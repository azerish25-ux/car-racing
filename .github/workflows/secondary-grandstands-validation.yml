name: A12 secondary-stand validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/infrastructure-render-budget.ts
      - docs/TRACK_INFRASTRUCTURE_RENDER_BASELINE.json
      - src/rendering/secondary-grandstand*
      - src/rendering/grandstand.ts
      - src/rendering/circuit.ts
      - src/rendering/renderer.ts
      - public/models/aurel-secondary-grandstands.glb
      - scripts/aurel-secondary-grandstands.blend
      - scripts/author-secondary-grandstands.py
      - tests/secondary-grandstand*.test.ts
      - tests/secondary-stand-traversal.test.ts
      - tests/secondary-stand-capture.test.ts
      - tests/secondary-stand-circulation.test.ts
      - tests/secondary-stand-camera.test.ts
      - tests/secondary-stand-artifacts.test.ts
      - e2e/secondary-grandstands.spec.ts
      - e2e/scenery-shadow-budget.spec.ts
      - e2e/fixtures/scenery-shadow-budget.ts
      - e2e/fixtures/secondary-stand*.ts
      - .github/workflows/secondary-grandstands-validation.yml
permissions:
  contents: read
jobs:
  browser:
    # Use the same verified Linux/Mesa backend as full CI. The macOS
    # SwiftShader fallback exceeded the unchanged application GPU deadline.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APEX_BROWSER_BACKEND: mesa
    strategy:
      fail-fast: false
      matrix:
        lighting: [day, sunset, night]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      - name: Check exact A12 assets and unchanged six-site layouts
        run: npx vitest run tests/secondary-grandstand-assets.test.ts tests/secondary-grandstands.test.ts tests/secondary-stand-traversal.test.ts tests/secondary-stand-capture.test.ts tests/secondary-stand-artifacts.test.ts tests/secondary-stand-circulation.test.ts tests/secondary-stand-camera.test.ts
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install Mesa and the virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - name: Cold cockpit budget, production scenery and physical lap traversal
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test e2e/scenery-shadow-budget.spec.ts e2e/secondary-grandstands.spec.ts --grep '(scenery shadow budget ${{ matrix.lighting }}$|A12 ${{ matrix.lighting }}:)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a12-${{ matrix.lighting }}-evidence
          path: |
            test-results/
            playwright-report/
            browser-backend.json
            browser-progress.json
          retention-days: 14
