name: Solvane final per-view review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/solvane-final-review.yml']
permissions:
  contents: read
jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify and apply the recovered candidate and reviewed corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/source-evidence"
          python3 - <<'PY'
          import os,json,base64,lzma,hashlib,urllib.request,subprocess
          from pathlib import Path,PurePosixPath
          def blob(sha):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as response: obj=json.load(response)
              data=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              return data
          packets=[(['59fe9616e88cd43cff277b82162648ded726a13b','c142ef366b943cf20d941e8cc51d06d4367d8adb','58939a68bdf9e981c791a0f2021abdae444ad9d4'],'b226b26af1b3b981aa4406ddeb67a87df65b1e474deab907c898dbfb28da2654'),(['0da41779a05f40c145e27983433ed93fa0227459'],'e49bf3dac52ce97fbbc8dfa9be35ead2f306e0e100039e9b16722e6cd45d8248'),(['99df4011c9ffe8f0ce84893a4d05fb16b5143aee'],'05bf79c1ae376b467ad4695dd6974faab7b5f69461c5a7bfb41cd743dbaa1579')]
          paths={}
          for shas,digest in packets:
              compressed=base64.b64decode(b''.join(blob(sha) for sha in shas),validate=True)
              assert hashlib.sha256(compressed).hexdigest()==digest
              payload=json.loads(lzma.decompress(compressed))
              for name,item in payload['files'].items():
                  p=PurePosixPath(name);assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in ('src','scripts','e2e','tests','authoring')
                  if item['before']:
                      assert subprocess.check_output(['git','hash-object',name],text=True).strip()==item['before'], 'Reconcile concurrent change: '+name
                      subprocess.run(['git','apply','--check','-'],input=item['patch'],text=True,check=True)
                  else: assert not Path(name).exists(), name
                  if name not in paths: paths[name]=item.get('repositoryBefore',item['before'])
              for name,item in payload['files'].items():
                  if item['before']: subprocess.run(['git','apply','-'],input=item['patch'],text=True,check=True)
                  else:
                      target=Path(name);target.parent.mkdir(parents=True,exist_ok=True);target.write_text(item['content'])
                  if 'sha256' in item: assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==item['sha256']
              for name,expected in payload.get('allSourceSha256',{}).items(): assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          name='tests/solvane-finial-mount.test.ts';assert not Path(name).exists();Path(name).write_bytes(blob('38f037eb6c8bf4e5854df2b394d27892c6eb565e'));paths[name]=None
          Path(os.environ['RUNNER_TEMP'],'code-paths.json').write_text(json.dumps(paths))
          print('Verified',len(paths),'final source files; no branch updated')
          PY
      - name: Install locked dependencies and pinned Blender
        run: |
          npm ci --no-audit --no-fund
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
      - name: Author all five native inspections and verify independent saved-source export
        run: |
          "$RUNNER_TEMP/blender/blender" -b -t 2 --factory-startup --python-exit-code 1 --python authoring/solvane/build_detail_kit.py -- --output-root "$PWD" --render > "$RUNNER_TEMP/source-evidence/blender-author.log" 2>&1
          "$RUNNER_TEMP/blender/blender" -b -t 2 --factory-startup --python-exit-code 1 --python authoring/solvane/build_detail_kit.py -- --source "$PWD/authoring/solvane/detail-kit.blend" --output-root "$RUNNER_TEMP/reexport" > "$RUNNER_TEMP/source-evidence/blender-reexport.log" 2>&1
          cmp public/models/solvane/detail-kit.glb "$RUNNER_TEMP/reexport/public/models/solvane/detail-kit.glb"
          echo 'aa9da4d19a73889affaf59a5e10ff1d5d8f18f8dbb3195f7d87f4e22734fbb1c  public/models/solvane/detail-kit.glb' | sha256sum -c -
      - name: Guarded regression, content, type, driving and production checks
        env:
          HORIZON_GAMEPLAY_OUTPUT: ${{ runner.temp }}/source-evidence/driving.json
        run: |
          node --experimental-transform-types scripts/source-stability.ts -- npx vitest run tests/solvane-detail-kit.test.ts tests/solvane-driving-detail.test.ts tests/solvane-street-light-pools.test.ts tests/festival-skill-chain.test.ts tests/secondary-stand-camera.test.ts tests/solvane-finial-mount.test.ts > "$RUNNER_TEMP/source-evidence/focused-tests.log" 2>&1
          node --experimental-transform-types scripts/source-stability.ts -- npm run lint > "$RUNNER_TEMP/source-evidence/lint.log" 2>&1
          node --experimental-transform-types scripts/source-stability.ts -- npm run validate:content > "$RUNNER_TEMP/source-evidence/content.log" 2>&1
          node --experimental-transform-types scripts/source-stability.ts -- node --experimental-transform-types scripts/horizon-gameplay-validation.ts > "$RUNNER_TEMP/source-evidence/driving.log" 2>&1
          node --experimental-transform-types scripts/source-stability.ts -- npm run build > "$RUNNER_TEMP/source-evidence/build.log" 2>&1
          cp dist/BUILD_IDENTITY.json "$RUNNER_TEMP/source-evidence/BUILD_IDENTITY.json"
      - name: Retain validated source and native assets as immutable Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,hashlib,urllib.request
          from pathlib import Path
          output=Path(os.environ['RUNNER_TEMP'],'source-evidence'); paths=json.loads(Path(os.environ['RUNNER_TEMP'],'code-paths.json').read_text())
          for p in ['authoring/solvane/detail-kit.blend','public/models/solvane/detail-kit.glb','public/models/solvane/detail-kit.manifest.json']:paths[p]=None
          for p in Path('docs/production/solvane-blender-evidence').glob('*.png'):paths[str(p)]=None
          entries=[]
          for name,before in paths.items():
              data=Path(name).read_bytes();expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              target=output/'source'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=90) as response:obj=json.load(response)
              assert obj['sha']==expected
              entries.append({'path':name,'mode':'100644','type':'blob','sha':expected,'before':before,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          receipt={'baseCommit':os.environ['GITHUB_SHA'],'branchUpdated':False,'roundtripIdentical':True,'candidateIsWorkingTree':True,'browserAcceptance':'Separate per-view jobs must pass','entries':entries,'buildIdentity':json.loads((output/'BUILD_IDENTITY.json').read_text())}
          (output/'authoring-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solvane-final-source
          path: ${{ runner.temp }}/source-evidence/
          retention-days: 14
          if-no-files-found: error
  browser:
    needs: author
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {scope: candidate, view: night-rain-street}
          - {scope: baseline, view: night-rain-street}
          - {scope: journey, view: input}
          - {scope: candidate, view: day-drive}
          - {scope: baseline, view: day-drive}
          - {scope: candidate, view: day-shopfront}
          - {scope: baseline, view: day-shopfront}
          - {scope: candidate, view: coastal-launch}
          - {scope: baseline, view: coastal-launch}
          - {scope: candidate, view: low-drive}
          - {scope: baseline, view: low-drive}
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      HORIZON_REVIEW_URL: http://127.0.0.1:5173
      HORIZON_REVIEW_OUTPUT: test-results/solvane-view
      HORIZON_REVIEW_IDENTITY: ${{ runner.temp }}/identity.json
      SOLVANE_REVIEW_VIEW: ${{ matrix.view }}
      SOLVANE_CANDIDATE: ${{ matrix.scope != 'baseline' && '1' || '0' }}
      HORIZON_REVIEW_QUALITY: low
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: solvane-final-source
          path: ${{ runner.temp }}/candidate
      - name: Apply only verified bytes; baseline receives observation tooling only
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib,subprocess
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['RUNNER_TEMP'],'candidate');receipt=json.loads((root/'authoring-receipt.json').read_text());assert receipt['baseCommit']==os.environ['GITHUB_SHA']
          observations={'e2e/fixtures/horizon-session.ts','e2e/fixtures/horizon-session.html','scripts/solvane-review-server.mjs','scripts/solvane-browser-review.mjs','scripts/horizon-browser-review.mjs'}
          for entry in receipt['entries']:
              name=entry['path'];p=PurePosixPath(name);assert not p.is_absolute() and '..' not in p.parts
              data=(root/'source'/name).read_bytes();assert hashlib.sha256(data).hexdigest()==entry['sha256']
              if os.environ['SCOPE']=='baseline' and name not in observations:continue
              target=Path(name)
              if entry['before']:assert subprocess.check_output(['git','hash-object',name],text=True).strip()==entry['before'],name
              else:assert not target.exists(),name
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          files={}
          for folder in ['src','public','e2e','scripts']:
              for p in sorted(Path(folder).rglob('*')):
                  if p.is_file() and p.name!='supplied-player-lods.bin.gz':files[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          identity={'baseCommit':os.environ['GITHUB_SHA'],'scope':os.environ['SCOPE'],'sourceAndAssetSHA256':files,'notHardwarePerformance':True,'baselineUsesObservationToolingOnly':os.environ['SCOPE']=='baseline'}
          Path(os.environ['HORIZON_REVIEW_IDENTITY']).write_text(json.dumps(identity,indent=2)+'\n')
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run generate:player-lods
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Start isolated review server
        run: |
          node scripts/solvane-review-server.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS "$HORIZON_REVIEW_URL/e2e/fixtures/horizon-session.html" >/dev/null && break; sleep 1; done
          curl -fsS "$HORIZON_REVIEW_URL/e2e/fixtures/horizon-session.html" >/dev/null
      - name: Single original view; unchanged frame count, viewport, quality and assertions
        if: matrix.scope != 'journey'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node --experimental-transform-types scripts/solvane-browser-review.mjs > "$RUNNER_TEMP/browser.log" 2>&1
      - name: Original real-input journey with explicitly assisted race completion
        if: matrix.scope == 'journey'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node --experimental-transform-types scripts/horizon-browser-review.mjs > "$RUNNER_TEMP/browser.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solvane-final-${{ matrix.scope }}-${{ matrix.view }}
          path: |
            test-results/solvane-view/
            ${{ runner.temp }}/identity.json
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/browser.log
          retention-days: 14
          if-no-files-found: error
  evidence:
    needs: [author, browser]
    if: always() && needs.author.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: solvane-final-*
          path: ${{ runner.temp }}/reviews
      - name: Verify all eleven scopes and retain exact evidence without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib,base64,urllib.request,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'],'reviews');out=Path(os.environ['RUNNER_TEMP'],'final-evidence');out.mkdir()
          source=root/'solvane-final-source';author=json.loads((source/'authoring-receipt.json').read_text())
          (out/'authoring-receipt.json').write_text(json.dumps(author,indent=2)+'\n')
          assert os.environ['BROWSER_RESULT']=='success','A browser scope failed; retain individual failure artifacts'
          def one(folder,pattern):
              hits=list(folder.glob(pattern));assert len(hits)==1,(str(folder),pattern,len(hits));return hits[0]
          files={};summaries={};views=['day-drive','day-shopfront','night-rain-street','coastal-launch','low-drive']
          for scope in ['baseline','candidate']:
              merged=None
              for view in views:
                  folder=root/('solvane-final-'+scope+'-'+view);path=one(folder,'**/visual-review.json');report=json.loads(path.read_text())
                  assert report['errors']==[] and report['failedAssets']==[] and not report.get('failure')
                  assert len(report['inspections'])==1 and report['inspections'][0]['id']==view
                  assert report['baseCommit']==os.environ['GITHUB_SHA']
                  assert report['candidate']==(scope=='candidate')
                  if scope=='candidate':assert report['sourceIdentity']['sourceAndAssetSHA256']['public/models/solvane/detail-kit.glb']=='aa9da4d19a73889affaf59a5e10ff1d5d8f18f8dbb3195f7d87f4e22734fbb1c'
                  if merged is None:merged={k:v for k,v in report.items() if k not in ['inspections','requestedView']};merged['inspections']=[];merged['individualReportSHA256']={}
                  merged['inspections'].extend(report['inspections']);merged['individualReportSHA256'][view]=hashlib.sha256(path.read_bytes()).hexdigest()
                  image=one(folder,'**/'+view+'.png').read_bytes();assert image.startswith(b'\x89PNG\r\n\x1a\n')
                  files['docs/production/solvane-evidence/'+scope+'/'+view+'.png']=image
              files['docs/production/solvane-evidence/'+scope+'/visual-review.json']=(json.dumps(merged,indent=2)+'\n').encode()
              summaries[scope]={'views':views,'errors':[],'failedAssets':[]}
          folder=root/'solvane-final-journey-input';path=one(folder,'**/journey.json');journey=json.loads(path.read_text())
          assert journey['completed'] and journey['errors']==[] and journey['failedAssets']==[]
          files['docs/production/solvane-evidence/journey/journey.json']=path.read_bytes()
          for image in folder.glob('**/*.png'):
              data=image.read_bytes();assert data.startswith(b'\x89PNG\r\n\x1a\n');files['docs/production/solvane-evidence/journey/'+image.name]=data
          summary={'baseCommit':os.environ['GITHUB_SHA'],'sourceRun':os.environ['GITHUB_RUN_ID'],'allElevenScopesPassed':True,'notHardwarePerformance':True,'raceCompletionExplicitlyAssisted':True,'scopes':summaries,'assetSHA256':'aa9da4d19a73889affaf59a5e10ff1d5d8f18f8dbb3195f7d87f4e22734fbb1c'}
          files['docs/production/solvane-evidence/summary.json']=(json.dumps(summary,indent=2)+'\n').encode()
          entries=[]
          for name,data in files.items():
              assert len(data)<10_000_000
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              target=out/'source'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=90) as response:result=json.load(response)
              assert result['sha']==expected
              entries.append({'path':name,'mode':'100644','type':'blob','sha':expected,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          receipt={'baseCommit':os.environ['GITHUB_SHA'],'sourceRun':os.environ['GITHUB_RUN_ID'],'branchUpdated':False,'entries':entries,'authoringReceipt':author}
          (out/'evidence-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          shutil.copytree(source,out/'authoring',dirs_exist_ok=True)
          print('Verified ten original views and the complete input journey; immutable evidence retained')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solvane-final-evidence
          path: ${{ runner.temp }}/final-evidence/
          retention-days: 14
          if-no-files-found: error
