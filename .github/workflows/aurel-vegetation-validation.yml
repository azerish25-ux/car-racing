name: A51-A54 vegetation validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/rendering/**'
      - 'public/models/aurel-vegetation.glb'
      - 'scripts/aurel-vegetation.blend'
      - 'scripts/author-aurel-vegetation.py'
      - 'tests/aurel-vegetation.test.ts'
      - 'e2e/aurel-vegetation.spec.ts'
      - 'e2e/fixtures/aurel-vegetation.ts'
      - '.github/workflows/aurel-vegetation-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain exact source before validation, including failing candidates
        run: |
          mkdir -p "$RUNNER_TEMP/vegetation-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/vegetation-source/apex-source.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/vegetation-source/commit.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/vegetation-source/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: vegetation-source
          path: ${{ runner.temp }}/vegetation-source/
          retention-days: 7
          compression-level: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      - run: npm run check:stable
      - uses: actions/upload-artifact@v4
        with:
          name: vegetation-tested-web
          path: dist/
          retention-days: 7
  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lighting: [day, sunset, night]
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: vegetation-tested-web
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Actual production renderer and unchanged budget gates
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test e2e/aurel-vegetation.spec.ts --grep 'A51-A54 ${{ matrix.lighting }} '
      - name: Independent retained cockpit regression
        if: matrix.lighting == 'day'
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: cockpit-playwright-report
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test e2e/p0-cockpit-framing.spec.ts --output=cockpit-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vegetation-${{ matrix.lighting }}-evidence
          path: |
            test-results/
            cockpit-test-results/
            playwright-report/
            cockpit-playwright-report/
            browser-backend.json
            browser-progress.json
          retention-days: 14
