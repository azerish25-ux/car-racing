name: Solvane immutable review evidence
on:
  workflow_run:
    workflows: ['Solvane authored detail review']
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  evidence:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 38997135892 && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38997135892
          name: solvane-authored-review
          path: ${{ runner.temp }}/review
      - name: Verify completed scopes and retain data only; never execute artifact content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib,base64,urllib.request
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'],'review'); output=Path(os.environ['RUNNER_TEMP'],'evidence-receipt'); output.mkdir()
          def one(pattern):
              hits=list(root.glob(pattern));assert len(hits)==1,(pattern,len(hits));return hits[0]
          one('**/browser-scopes-passed.txt')
          author=json.loads(one('**/authoring-receipt.json').read_text())
          assert author['roundtripIdentical'] and not author['branchUpdated']
          assert author['baseCommit']=='88bf676c0aee2bd2952483eccba5e613d0afe871'
          files={}; summary={'sourceRun':38997135892,'baseCommit':author['baseCommit'],'notHardwarePerformance':True,'scopes':{}}
          for scope in ['baseline','candidate']:
              report_path=one('**/solvane-'+scope+'/visual-review.json'); report=json.loads(report_path.read_text())
              assert not report.get('failure') and report['errors']==[] and report['failedAssets']==[]
              assert len(report['inspections'])==5
              files['docs/production/solvane-evidence/'+scope+'/visual-review.json']=report_path.read_bytes()
              views=[]
              for item in report['inspections']:
                  name=item['id'];assert name in ['day-drive','day-shopfront','night-rain-street','coastal-launch','low-drive']
                  path=report_path.parent/(name+'.png'); data=path.read_bytes();assert data.startswith(b'\x89PNG\r\n\x1a\n')
                  files['docs/production/solvane-evidence/'+scope+'/'+name+'.png']=data
                  views.append({'id':name,'kind':item['kind'],'renderer':item['renderer'],'sha256':hashlib.sha256(data).hexdigest()})
              summary['scopes'][scope]={'images':views,'reportSHA256':hashlib.sha256(report_path.read_bytes()).hexdigest()}
          journey_path=one('**/solvane-journey/journey.json');journey=json.loads(journey_path.read_text())
          assert journey.get('completed') is True and not journey.get('failure') and journey.get('errors',[])==[] and journey.get('failedAssets',[])==[]
          files['docs/production/solvane-evidence/journey/journey.json']=journey_path.read_bytes()
          images=[]
          for path in sorted(journey_path.parent.glob('*.png')):
              data=path.read_bytes();assert data.startswith(b'\x89PNG\r\n\x1a\n')
              files['docs/production/solvane-evidence/journey/'+path.name]=data
              images.append({'file':path.name,'sha256':hashlib.sha256(data).hexdigest()})
          assert images
          summary['scopes']['journey']={'images':images,'reportSHA256':hashlib.sha256(journey_path.read_bytes()).hexdigest(),'raceCompletionUsesExplicitAssistance':True}
          files['docs/production/solvane-evidence/summary.json']=(json.dumps(summary,indent=2)+'\n').encode()
          entries=[]
          for name,data in files.items():
              assert len(data)<10_000_000
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=90) as response: result=json.load(response)
              assert result['sha']==expected
              entries.append({'path':name,'mode':'100644','type':'blob','sha':expected,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          receipt={'sourceRun':38997135892,'branchUpdated':False,'entries':entries,'sourceAuthoringReceipt':author}
          (output/'evidence-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          (output/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('Retained',len(entries),'exact data files as immutable objects; no branch updated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: solvane-immutable-evidence-receipt
          path: ${{ runner.temp }}/evidence-receipt/
          retention-days: 14
          if-no-files-found: error
