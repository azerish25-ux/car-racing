name: Motocross committed-source review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/motocross-final-review.yml
      - authoring/motocross/**
      - src/rendering/offroad/**
      - src/rendering/assets/mx-authored-kit.mesh.json
      - src/rendering/rider.ts
      - src/rendering/ground/normal-residency.ts
      - src/rendering/ground/scan-store.ts
      - src/rendering/assets/texture-loader.ts
      - src/simulation/offroad/**
      - src/ui/offroad-hud.ts
      - tests/motocross-*.test.ts
      - tests/normal-residency.test.ts
      - e2e/*motocross*.spec.ts
      - e2e/fixtures/motocross-*
      - package-lock.json
permissions:
  contents: read
concurrency:
  group: motocross-final-review
  cancel-in-progress: true
# This is an additional focused review, not a publication path. The full unit,
# physics, offroad, browser and wet-presentation release gates remain in ci.yml.
# All inputs now come from this checkout, not expiring candidate artifacts.
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install the locked tools
        run: npm ci --no-audit --no-fund
      - name: Checksum-pinned Blender for original native asset verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mx-proof"
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libice6
          curl --fail --location --retry 2 --max-time 240 -o "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Reproduce the committed mesh and independently reopen its saved editable source
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 2 --factory-startup --python-exit-code 1 --python authoring/motocross/build_kit.py -- --output "$RUNNER_TEMP/mx-proof/rebuilt.mesh.json" 2>&1 | tee "$RUNNER_TEMP/mx-proof/rebuild.log"
          cmp src/rendering/assets/mx-authored-kit.mesh.json "$RUNNER_TEMP/mx-proof/rebuilt.mesh.json"
          blender -b -t 2 --factory-startup --python-exit-code 1 --python authoring/motocross/verify_saved_kit.py -- --report "$RUNNER_TEMP/mx-proof/native-reopen.json" 2>&1 | tee "$RUNNER_TEMP/mx-proof/native-reopen.log"
          git diff --exit-code
      - name: Lint, content, motocross contracts and the production build
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-transform-types scripts/source-stability.ts -- bash -c 'npm run lint && npm run validate:content && npx vitest run tests/motocross-*.test.ts tests/normal-residency.test.ts tests/texture-loader-lifecycle.test.ts tests/gp-r5-materials.test.ts tests/gp-engine-braking.test.ts && npm run build' 2>&1 | tee "$RUNNER_TEMP/mx-proof/build.log"
          git diff --exit-code
          cp dist/BUILD_IDENTITY.json "$RUNNER_TEMP/mx-proof/BUILD_IDENTITY.json"
          git rev-parse HEAD > "$RUNNER_TEMP/mx-proof/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motocross-committed-build-proof
          path: ${{ runner.temp }}/mx-proof/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: motocross-committed-web
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [models-world, journey]
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: motocross-committed-web
          path: dist/
      - name: Install the locked browser and Mesa
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Verify every authored mip of the shipped dry, wet and forest ground normals
        if: matrix.suite == 'models-world'
        shell: bash
        run: |
          set -euo pipefail
          export MX_NORMAL_PROOF_OUTPUT="$RUNNER_TEMP/mx-qa/shipped-normal"
          node --experimental-transform-types scripts/source-stability.ts -- xvfb-run -a -s '-screen 0 1280x800x24' node --experimental-transform-types authoring/motocross/verify_normal_fidelity.mjs
      - name: Original full-quality world and real-input acceptance assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mx-qa"
          if [ '${{ matrix.suite }}' = journey ]; then
            specs=(e2e/45-motocross-gameplay.spec.ts)
          else
            specs=(e2e/42-motocross-bike.spec.ts e2e/43-motocross-world.spec.ts e2e/44-motocross-interface.spec.ts e2e/46-motocross-normal-residency.spec.ts)
          fi
          node --experimental-transform-types scripts/source-stability.ts -- xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test "${specs[@]}" --config playwright.motocross.config.ts 2>&1 | tee "$RUNNER_TEMP/mx-qa/browser.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motocross-committed-qa-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/mx-qa/
            test-results/motocross/
            playwright-report/motocross/
            browser-backend.json
          retention-days: 14
          if-no-files-found: error
