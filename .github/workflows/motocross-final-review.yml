name: Motocross final UV and gameplay review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/motocross-final-review.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: motocross-final-review
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: motocross-integrated-candidate
          run-id: 39062655109
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mx-prior
      - name: Restore authenticated candidate and apply UV-only correction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mx-final"
          node --input-type=module <<'JS'
          import * as fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {execFileSync} from 'node:child_process';
          const prior=`${process.env.RUNNER_TEMP}/mx-prior`, out=`${process.env.RUNNER_TEMP}/mx-final`;
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const blob=b=>createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',stdio:['ignore','pipe','pipe']}).trim();
          const current=p=>{try{return git('rev-parse','--verify',`HEAD:${p}`)}catch{return null}};
          if(hash(fs.readFileSync(`${prior}/candidate-manifest.json`))!=='127e8e43875979286e5ebe0a284d4ee458ab40a83ab0784bf43b20f3b14fa70b')throw Error('Manifest identity');
          const m=JSON.parse(fs.readFileSync(`${prior}/candidate-manifest.json`));
          if(m.files.length!==29||m.baseCommit!=='7e423d18b4d7ea1b2478bb23ed70e6a367d57adf')throw Error('Candidate identity');
          if(hash(fs.readFileSync(`${prior}/candidate-files.tar.gz`))!==m.archiveSHA256)throw Error('Archive identity');
          const base={};
          for(const f of m.files){
            if(!/^(src|e2e|tests|authoring\/motocross|docs\/production)\/[\w./-]+$/.test(f.path)||f.path.includes('..'))throw Error('Unsafe path');
            base[f.path]=current(f.path);
            if(base[f.path]!==f.before)throw Error(`Concurrent change requires review: ${f.path}`);
          }
          execFileSync('tar',['-xzf',`${prior}/candidate-files.tar.gz`,'--',...m.files.map(f=>f.path)]);
          for(const f of m.files)if(hash(fs.readFileSync(f.path))!==f.sha256)throw Error(`Candidate bytes: ${f.path}`);
          fs.copyFileSync('src/rendering/assets/mx-authored-kit.mesh.json',`${out}/before-uv-kit.json`);
          git('add','--',...m.files.map(f=>f.path));
          const sha='75168544e09e951e666154d0af9fbc42b17fbbf9';
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs/${sha}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
          if(!r.ok)throw Error(`UV patch HTTP ${r.status}`);
          const b=Buffer.from((await r.json()).content,'base64');
          if(blob(b)!==sha)throw Error('UV patch blob integrity');
          const patch=gunzipSync(b);
          if(hash(patch)!=='1bad8fc4f1e90231627039c57970425927526aacf7157bef626dd02cbd21a999')throw Error('UV patch integrity');
          for(const p of ['src/rendering/offroad/dirt-bike-model.ts','src/rendering/offroad/number-plate-uv.ts','tests/motocross-uv-footprint.test.ts']){
            base[p]=current(p);
            if(p!=='src/rendering/offroad/dirt-bike-model.ts'&&base[p]!==null)throw Error(`Concurrent new path: ${p}`);
          }
          fs.writeFileSync(`${out}/uv-correction.patch`,patch);
          git('apply','--check','--index',`${out}/uv-correction.patch`);
          git('apply','--index',`${out}/uv-correction.patch`);
          fs.writeFileSync(`${out}/base-inputs.json`,JSON.stringify(base,null,2)+'\n');
          JS
      - name: Correct production linear metadata and add shipped-texture fidelity regression
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import * as fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {execFileSync} from 'node:child_process';
          const sha='187075963f158d93e2e520cf60b98a2fca44ed6f';
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs/${sha}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
          if(!r.ok)throw Error(`Linear metadata patch HTTP ${r.status}`);
          const b=Buffer.from((await r.json()).content,'base64');
          if(createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')!==sha)throw Error('Linear metadata patch blob integrity');
          const patch=gunzipSync(b);
          if(patch.length!==10624||createHash('sha256').update(patch).digest('hex')!=='88f86af183da81296ae94cf2ed8fa694ed54ff4139438af17101ea772063b172')throw Error('Linear metadata patch integrity');
          const out=`${process.env.RUNNER_TEMP}/mx-final/linear-metadata.patch`;
          fs.writeFileSync(out,patch);
          execFileSync('git',['apply','--check','--index',out]);
          execFileSync('git',['apply','--index',out]);
          JS
      - name: Install locked tools and checksum-pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libice6
          curl --fail --location --retry 2 --max-time 240 -o "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Rebuild UVs and prove unchanged geometry and normals
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 2 --factory-startup --python-exit-code 1 --python authoring/motocross/build_kit.py -- --output src/rendering/assets/mx-authored-kit.mesh.json --blend authoring/motocross/motocross-authored-kit.blend 2>&1 | tee "$RUNNER_TEMP/mx-final/blender.log"
          echo 'cedd5be0c520542a2362e6fb796736391fd46d5619b7cb7b6fa4b71f66149ed9  src/rendering/assets/mx-authored-kit.mesh.json' | sha256sum --check
          python - <<'PY'
          import pathlib,json,os
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'mx-final'
          a=json.loads((out/'before-uv-kit.json').read_text())
          b=json.loads(pathlib.Path('src/rendering/assets/mx-authored-kit.mesh.json').read_text())
          proof=[]
          for part,levels in a['meshes'].items():
              for level,old in levels.items():
                  new=b['meshes'][part][level]
                  assert len(old['index'])==len(new['index'])
                  for attr in ['position','normal']:
                      assert [old[attr][i*3:i*3+3] for i in old['index']]==[new[attr][i*3:i*3+3] for i in new['index']],(part,level,attr)
                  proof.append(dict(part=part,detail=level,triangles=len(new['index'])//3,geometryAndNormalsIdentical=True))
          (out/'uv-geometry-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
          git add -- authoring/motocross/motocross-authored-kit.blend src/rendering/assets/mx-authored-kit.mesh.json
      - name: Lint, content, geometry, controls, materials and production build
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-transform-types scripts/source-stability.ts -- bash -c 'npm run lint && npm run validate:content && npx vitest run tests/motocross-uv-footprint.test.ts tests/motocross-authored-kit.test.ts tests/motocross-cockpit-view.test.ts tests/motocross-rhythm-coach.test.ts tests/motocross-reference-review.test.ts tests/motocross-shoulder-recovery.test.ts tests/motocross-hud.test.ts tests/normal-residency.test.ts tests/texture-loader-lifecycle.test.ts tests/gp-r5-materials.test.ts tests/gp-engine-braking.test.ts && npm run build' 2>&1 | tee "$RUNNER_TEMP/mx-final/prepare.log"
      - name: Preserve exact final candidate without advancing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import * as fs from 'node:fs';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
          const out=`${process.env.RUNNER_TEMP}/mx-final`,base=JSON.parse(fs.readFileSync(`${out}/base-inputs.json`)),files=[];
          for(const [path,before]of Object.entries(base)){
            const b=fs.readFileSync(path),sha=createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
            const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({encoding:'base64',content:b.toString('base64')})});
            if(!r.ok||(await r.json()).sha!==sha)throw Error(`Candidate upload: ${path}`);
            files.push({path,before,blob:sha,sha256:createHash('sha256').update(b).digest('hex'),bytes:b.length});
          }
          execFileSync('tar',['-czf',`${out}/candidate-files.tar.gz`,'--',...files.map(f=>f.path)]);
          const archiveSHA256=createHash('sha256').update(fs.readFileSync(`${out}/candidate-files.tar.gz`)).digest('hex');
          fs.writeFileSync(`${out}/candidate-manifest.json`,JSON.stringify({baseCommit:process.env.GITHUB_SHA,files,archiveSHA256,notReleaseApproval:true},null,2)+'\n');
          JS
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/mx-final-web"
          tar -czf "$RUNNER_TEMP/mx-final-web/dist.tar.gz" dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motocross-final-candidate
          path: ${{ runner.temp }}/mx-final/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: motocross-final-web
          path: ${{ runner.temp }}/mx-final-web/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  qa:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [models-world, journey, units, scenarios]
    env:
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: motocross-final-candidate
          path: ${{ runner.temp }}/mx-final
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'models-world' || matrix.suite == 'journey'
        with:
          name: motocross-final-web
          path: ${{ runner.temp }}/mx-final-web
      - name: Authenticate and restore only the final candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mx-qa"
          python - <<'PY'
          import pathlib,json,os,hashlib,subprocess
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'mx-final'
          m=json.loads((p/'candidate-manifest.json').read_text())
          assert m['baseCommit']==os.environ['GITHUB_SHA']
          assert hashlib.sha256((p/'candidate-files.tar.gz').read_bytes()).hexdigest()==m['archiveSHA256']
          subprocess.run(['tar','-xzf',str(p/'candidate-files.tar.gz')],check=True)
          for f in m['files']: assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          subprocess.run(['git','add','--',*[f['path'] for f in m['files']]],check=True)
          PY
          npm ci --no-audit --no-fund
      - name: Install original browser and full-quality web build
        if: matrix.suite == 'models-world' || matrix.suite == 'journey'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/mx-final-web/dist.tar.gz"
          npx playwright install --with-deps chromium
          sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Original full-quality browser, complete unit suite and gameplay assertions
        shell: bash
        run: |
          set -euo pipefail
          suite='${{ matrix.suite }}'
          case "$suite" in
            models-world) command=(xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test e2e/42-motocross-bike.spec.ts e2e/43-motocross-world.spec.ts e2e/44-motocross-interface.spec.ts e2e/46-motocross-normal-residency.spec.ts --config playwright.motocross.config.ts);;
            journey) command=(xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test e2e/45-motocross-gameplay.spec.ts --config playwright.motocross.config.ts);;
            units) command=(node --experimental-transform-types scripts/source-stability.ts -- npm test);;
            scenarios) command=(npm run test:offroad)
              cp docs/offroad-calibration.json "$RUNNER_TEMP/mx-qa/before-calibration.json"
              cp docs/offroad-races.json "$RUNNER_TEMP/mx-qa/before-races.json"
              trap 'cp docs/offroad-calibration.json "$RUNNER_TEMP/mx-qa/offroad-calibration.json"; cp docs/offroad-races.json "$RUNNER_TEMP/mx-qa/offroad-races.json"; cp "$RUNNER_TEMP/mx-qa/before-calibration.json" docs/offroad-calibration.json; cp "$RUNNER_TEMP/mx-qa/before-races.json" docs/offroad-races.json' EXIT;;
            *) exit 2;;
          esac
          if "${command[@]}" 2>&1 | tee "$RUNNER_TEMP/mx-qa/$suite.log"; then echo 0 > "$RUNNER_TEMP/mx-qa/exit.txt"; else code=$?; echo "$code" > "$RUNNER_TEMP/mx-qa/exit.txt"; exit "$code"; fi
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motocross-final-qa-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/mx-qa/
            test-results/motocross/
          retention-days: 14
          if-no-files-found: error
