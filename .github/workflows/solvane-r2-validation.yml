name: Solvane R2 source validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/solvane-r2-validation.yml
      - authoring/solvane/build_street_kit.py
      - authoring/solvane/street-kit.blend
      - public/models/solvane/street-kit.*
      - src/rendering/open-world/street-details.ts
      - src/rendering/open-world/contact-shadows.ts
      - src/rendering/open-world/pace-coach.ts
      - src/rendering/open-world/horizon-guidance.ts
      - src/rendering/open-world/festival-renderer.ts
      - src/session/free-roam.ts
      - src/ui/festival-hud.*
      - scripts/solvane-r2-browser-review.mjs
      - tests/solvane-*.test.ts
      - e2e/fixtures/horizon-session.ts
permissions:
  contents: read
concurrency:
  group: solvane-r2-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_OUT: /tmp/solvane-r2-source
      HORIZON_GAMEPLAY_OUTPUT: /tmp/solvane-r2-source/driving.json
      APEX_BROWSER_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      HORIZON_REVIEW_URL: http://127.0.0.1:5174
      HORIZON_REVIEW_PORT: '5174'
      HORIZON_REVIEW_IDENTITY: /tmp/solvane-r2-source/BUILD_IDENTITY.json
      HORIZON_REVIEW_QUALITY: low
      SOLVANE_R2_CANDIDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: mkdir -p "$R2_OUT"
      - run: node --experimental-transform-types scripts/source-stability.ts -- npm ci --no-audit --no-fund
      - name: Verify the pinned authoring tool and reopen actual committed source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" -b -t 2 --factory-startup --python-exit-code 1 --python authoring/solvane/build_street_kit.py -- --source "$PWD/authoring/solvane/street-kit.blend" --output-root "$RUNNER_TEMP/street-reexport" > "$R2_OUT/native-reopen.log" 2>&1
          for f in street-kit.glb street-kit.bin street-kit.manifest.json; do cmp "public/models/solvane/$f" "$RUNNER_TEMP/street-reexport/public/models/solvane/$f"; done
          test -z "$(git status --porcelain)"
      - name: Focused regression contracts, content, scripted driving and production build
        run: |
          set -euo pipefail
          node --experimental-transform-types scripts/source-stability.ts -- npx vitest run tests/solvane-*.test.ts tests/festival-ground-height.test.ts tests/festival-effects-integration.test.ts tests/festival-skill-chain.test.ts tests/festival-car-switch.test.ts tests/festival-presentation.test.ts --reporter=json --outputFile="$R2_OUT/tests.json" 2>&1 | tee "$R2_OUT/tests.log"
          node --experimental-transform-types scripts/source-stability.ts -- npm run lint 2>&1 | tee "$R2_OUT/lint.log"
          node --experimental-transform-types scripts/source-stability.ts -- npm run validate:content 2>&1 | tee "$R2_OUT/content.log"
          node --experimental-transform-types scripts/source-stability.ts -- node --experimental-transform-types scripts/horizon-gameplay-validation.ts 2>&1 | tee "$R2_OUT/driving.log"
          node --experimental-transform-types scripts/source-stability.ts -- npm run build 2>&1 | tee "$R2_OUT/build.log"
          cp dist/BUILD_IDENTITY.json "$R2_OUT/BUILD_IDENTITY.json"
          test -z "$(git status --porcelain)"
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils xvfb
      - name: Actual runtime compositions, both event-entry rules and input lifecycle
        run: |
          set -euo pipefail
          node scripts/solvane-review-server.mjs > "$R2_OUT/server.log" 2>&1 & server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS "$HORIZON_REVIEW_URL/e2e/fixtures/horizon-session.html" >/dev/null && break; sleep 1; done
          curl -fsS "$HORIZON_REVIEW_URL/e2e/fixtures/horizon-session.html" >/dev/null
          HORIZON_REVIEW_OUTPUT="$R2_OUT/compositions-and-entry" SOLVANE_R2_VIEW=all xvfb-run -a -s '-screen 0 1920x1080x24' node --experimental-transform-types scripts/solvane-r2-browser-review.mjs
          HORIZON_REVIEW_OUTPUT="$R2_OUT/input-journey" xvfb-run -a -s '-screen 0 1920x1080x24' node --experimental-transform-types scripts/horizon-browser-review.mjs
          test -z "$(git status --porcelain)"
          printf '{"passed":true,"source":"committed checkout","releaseApproval":false}\n' > "$R2_OUT/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solvane-r2-committed-source
          path: /tmp/solvane-r2-source/
          if-no-files-found: error
          retention-days: 14
